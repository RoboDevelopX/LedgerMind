[project]
name = "ledgermind"
version = "0.2.0"
description = "A private AI finance assistant that remembers your money, powered by NVIDIA Nemotron on Nebius Token Factory."
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: calls the real Token Factory API (set LEDGERMIND_LIVE_TESTS=1)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B008"]
